name: Validate published GFX portability

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Silex version, or latest
        required: true
        default: latest

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            execution: compile
          - runner: ubuntu-24.04
            execution: run
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the consumer smokes
        uses: actions/checkout@v6

      - name: Validate the published GFX package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          export SILEX_INSTALL_DIR="$RUNNER_TEMP/bin"
          export SILEX_VERSION="$REQUESTED_VERSION"
          mkdir -p "$HOME"

          curl -fsSL https://raw.githubusercontent.com/Matanek/Silex/main/install.sh | sh
          "$SILEX_INSTALL_DIR/silex" --version
          "$SILEX_INSTALL_DIR/silex" setup
          "$SILEX_INSTALL_DIR/silex" install STD
          "$SILEX_INSTALL_DIR/silex" install GFX
          mkdir -p "$RUNNER_TEMP/packages"
          find_package() {
            find "$HOME/.silex/packages" -maxdepth 1 -type d -name "$1@*" -print -quit
          }
          gfx_install=$(find_package GFX)
          gfx_audio=$(find_package GFX.Audio)
          gfx_canvas=$(find_package GFX.Canvas)
          gfx_scene2d=$(find_package GFX.Scene2D)
          test -n "$gfx_install" && test -n "$gfx_audio" && test -n "$gfx_canvas" && test -n "$gfx_scene2d"
          cp -R "$gfx_install" "$RUNNER_TEMP/packages/GFX"
          package="$RUNNER_TEMP/packages/GFX"
          repository="$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/packages"

          if [ "${{ matrix.execution }}" = "run" ]; then
            "$SILEX_INSTALL_DIR/silex" compile "$gfx_audio/Smokes/Audio.sx" -o "$RUNNER_TEMP/gfx-audio"
            timeout 30s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$RUNNER_TEMP/gfx-audio"
            "$SILEX_INSTALL_DIR/silex" compile "$gfx_canvas/Smokes/Text.sx" -o "$RUNNER_TEMP/gfx-text"
            timeout 30s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$RUNNER_TEMP/gfx-text"
            "$SILEX_INSTALL_DIR/silex" test "$package/Tests/Color.sx"
            "$SILEX_INSTALL_DIR/silex" test "$gfx_scene2d/Tests/ViewportCamera.sx"
            "$SILEX_INSTALL_DIR/silex" test "$package/Tests/Application/CollectionFieldMutation.sx"
            "$SILEX_INSTALL_DIR/silex" compile "$repository/Examples/Distribution/GFX/Runtime.sx" -o "$RUNNER_TEMP/gfx-runtime-smoke"
            timeout 30s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$RUNNER_TEMP/gfx-runtime-smoke"
            "$SILEX_INSTALL_DIR/silex" compile "$repository/Examples/Distribution/GFX/Window.sx" -o "$RUNNER_TEMP/gfx-window-smoke"
            "$SILEX_INSTALL_DIR/silex" compile "$repository/Examples/Distribution/GFX/Canvas.sx" -o "$RUNNER_TEMP/gfx-canvas-smoke"
            "$SILEX_INSTALL_DIR/silex" compile "$repository/Examples/Distribution/GFX/Extensibility.sx" -o "$RUNNER_TEMP/gfx-extensibility-smoke"
          else
            "$SILEX_INSTALL_DIR/silex" compile "$gfx_audio/Smokes/Audio.sx" -o "$RUNNER_TEMP/gfx-audio"
            "$SILEX_INSTALL_DIR/silex" compile "$gfx_canvas/Smokes/Text.sx" -o "$RUNNER_TEMP/gfx-text"
            "$SILEX_INSTALL_DIR/silex" compile "$repository/Examples/Distribution/GFX/Runtime.sx" -o "$RUNNER_TEMP/gfx-runtime-smoke"
            "$SILEX_INSTALL_DIR/silex" compile "$repository/Examples/Distribution/GFX/Window.sx" -o "$RUNNER_TEMP/gfx-window-smoke"
            "$SILEX_INSTALL_DIR/silex" compile "$repository/Examples/Distribution/GFX/Canvas.sx" -o "$RUNNER_TEMP/gfx-canvas-smoke"
            "$SILEX_INSTALL_DIR/silex" compile "$repository/Examples/Distribution/GFX/Extensibility.sx" -o "$RUNNER_TEMP/gfx-extensibility-smoke"
          fi

  windows-x64:
    runs-on: windows-2025

    steps:
      - name: Check out the consumer smokes
        uses: actions/checkout@v6

      - name: Validate the published GFX package
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:HOME = $env:USERPROFILE
          $env:SILEX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "bin"
          $env:SILEX_VERSION = $env:REQUESTED_VERSION
          $env:SDL_AUDIODRIVER = "dummy"
          $env:SDL_VIDEODRIVER = "dummy"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null

          Invoke-Expression (Invoke-RestMethod https://raw.githubusercontent.com/Matanek/Silex/main/install.ps1)
          $silex = Join-Path $env:SILEX_INSTALL_DIR "silex.exe"
          & $silex --version
          & $silex setup
          & $silex install STD
          & $silex install GFX
          $packages = Join-Path $env:RUNNER_TEMP "packages"
          New-Item -ItemType Directory -Force $packages | Out-Null
          function Find-Package([string] $name) {
            $package = Get-ChildItem (Join-Path $env:USERPROFILE ".silex/packages") -Directory -Filter "$name@*" | Select-Object -First 1
            if (-not $package) {
              throw "$name was not installed"
            }
            return $package.FullName
          }
          $gfxInstall = Find-Package "GFX"
          $gfxAudio = Find-Package "GFX.Audio"
          $gfxCanvas = Find-Package "GFX.Canvas"
          $gfxScene2D = Find-Package "GFX.Scene2D"
          Copy-Item -Recurse $gfxInstall (Join-Path $packages "GFX")
          $package = Join-Path $packages "GFX"
          Set-Location $packages
          & $silex test (Join-Path $package "Tests/Color.sx")
          & $silex test (Join-Path $gfxScene2D "Tests/ViewportCamera.sx")
          & $silex test (Join-Path $package "Tests/Application/CollectionFieldMutation.sx")
          $audio = Join-Path $env:RUNNER_TEMP "gfx-audio.exe"
          & $silex compile (Join-Path $gfxAudio "Smokes/Audio.sx") -o $audio
          & $audio
          $text = Join-Path $env:RUNNER_TEMP "gfx-text.exe"
          & $silex compile (Join-Path $gfxCanvas "Smokes/Text.sx") -o $text
          & $text
          $runtime = Join-Path $env:RUNNER_TEMP "gfx-runtime-smoke.exe"
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Runtime.sx") -o $runtime
          $process = Start-Process -FilePath $runtime -NoNewWindow -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "The linked SDL3 runtime did not exit within 30 seconds"
          }
          if ($process.ExitCode -ne 0) {
            throw "The linked SDL3 runtime exited with code $($process.ExitCode)"
          }
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Window.sx") -o (Join-Path $env:RUNNER_TEMP "gfx-window-smoke.exe")
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Canvas.sx") -o (Join-Path $env:RUNNER_TEMP "gfx-canvas-smoke.exe")
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Extensibility.sx") -o (Join-Path $env:RUNNER_TEMP "gfx-extensibility-smoke.exe")
