name: Validate published GFX portability

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Silex version, or latest
        required: true
        default: latest

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            zig_archive: zig-aarch64-macos-0.16.0.tar.xz
            zig_sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
            execution: compile
          - runner: ubuntu-24.04
            zig_archive: zig-x86_64-linux-0.16.0.tar.xz
            zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            execution: run
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the consumer smokes
        uses: actions/checkout@v6

      - name: Validate the published GFX package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          ZIG_ARCHIVE: ${{ matrix.zig_archive }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          export SILEX_INSTALL_DIR="$RUNNER_TEMP/bin"
          export SILEX_VERSION="$REQUESTED_VERSION"
          mkdir -p "$HOME" "$RUNNER_TEMP/zig"

          curl -fsSL "https://ziglang.org/download/0.16.0/$ZIG_ARCHIVE" -o "$RUNNER_TEMP/$ZIG_ARCHIVE"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$ZIG_ARCHIVE" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$ZIG_ARCHIVE" -C "$RUNNER_TEMP/zig" --strip-components=1
          export PATH="$RUNNER_TEMP/zig:$PATH"
          zig version

          curl -fsSL https://raw.githubusercontent.com/Matanek/Silex/main/install.sh | sh
          "$SILEX_INSTALL_DIR/silex" --version
          "$SILEX_INSTALL_DIR/silex" install STD
          "$SILEX_INSTALL_DIR/silex" install GFX

          if [ "${{ matrix.execution }}" = "run" ]; then
            SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy \
              "$SILEX_INSTALL_DIR/silex" run Examples/Distribution/GFX/Runtime.sx
          else
            "$SILEX_INSTALL_DIR/silex" compile Examples/Distribution/GFX/Runtime.sx -o "$RUNNER_TEMP/gfx-runtime-smoke"
            "$SILEX_INSTALL_DIR/silex" compile Examples/Distribution/GFX/Window.sx -o "$RUNNER_TEMP/gfx-window-smoke"
            "$SILEX_INSTALL_DIR/silex" compile Examples/Distribution/GFX/Drawing.sx -o "$RUNNER_TEMP/gfx-drawing-smoke"
          fi

  windows-x64:
    runs-on: windows-2025

    steps:
      - name: Check out the consumer smokes
        uses: actions/checkout@v6

      - name: Install Zig 0.16 for native package linking
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
          if ($actual -ne $expected) {
            throw "Zig archive checksum mismatch: expected $expected, got $actual"
          }
          $zigRoot = Join-Path $env:RUNNER_TEMP "zig"
          Expand-Archive $archive -DestinationPath $zigRoot
          $zigBin = (Get-ChildItem $zigRoot -Directory | Select-Object -First 1).FullName
          $zigBin | Out-File $env:GITHUB_PATH -Append

      - name: Validate the published GFX package
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:HOME = $env:USERPROFILE
          $env:SILEX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "bin"
          $env:SILEX_VERSION = $env:REQUESTED_VERSION
          $env:SDL_AUDIODRIVER = "dummy"
          $env:SDL_VIDEODRIVER = "dummy"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null

          zig version
          Invoke-Expression (Invoke-RestMethod https://raw.githubusercontent.com/Matanek/Silex/main/install.ps1)
          $silex = Join-Path $env:SILEX_INSTALL_DIR "silex.exe"
          & $silex --version
          & $silex install STD
          & $silex install GFX
          & $silex run Examples/Distribution/GFX/Runtime.sx
