name: Validate native x64 toolchain

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Toolchain/**"
      - "Registry.json"
      - "Examples/Distribution/**"
      - ".github/workflows/native-portability.yml"
  push:
    branches: [main]
    paths:
      - "Toolchain/**"
      - "Registry.json"
      - "Examples/Distribution/**"
      - ".github/workflows/native-portability.yml"

permissions:
  contents: read

jobs:
  x64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            shell: bash
          - runner: windows-2025
            shell: pwsh
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out Silex
        uses: actions/checkout@v6

      - name: Install bootstrap Zig on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Install bootstrap Zig on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") {
            throw "Zig archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0")

      - name: Build and validate on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          zig build -Doptimize=ReleaseSafe -Dcpu=baseline --prefix "$RUNNER_TEMP/silex-prefix" --build-file Toolchain/build.zig
          silex="$RUNNER_TEMP/silex-prefix/bin/silex"
          "$silex" setup
          "$silex" install STD
          "$silex" install GFX
          "$silex" test "$GITHUB_WORKSPACE/Tests/Types/Str/Operators.sx"
          "$silex" test "$GITHUB_WORKSPACE/Tests/Types/Str/Returns.sx"
          mkdir -p "$RUNNER_TEMP/packages"
          cp -R "$HOME/.silex/packages/GFX@0.23.1" "$RUNNER_TEMP/packages/GFX"
          cd "$RUNNER_TEMP/packages"
          "$silex" test GFX/Tests/Color.sx
          "$silex" test GFX/Tests/TransformCamera.sx
          "$silex" test GFX/Tests/CollectionFieldMutation.sx
          "$silex" compile GFX/Smokes/NativeLibraries.sx -o "$RUNNER_TEMP/gfx-native-libraries"
          timeout 30s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$RUNNER_TEMP/gfx-native-libraries"
          "$silex" compile "$GITHUB_WORKSPACE/Examples/Distribution/GFX/Runtime.sx" -o "$RUNNER_TEMP/gfx-runtime"
          timeout 30s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$RUNNER_TEMP/gfx-runtime"
          "$silex" compile "$GITHUB_WORKSPACE/Examples/Distribution/GFX/Window.sx" -o "$RUNNER_TEMP/gfx-window"
          "$silex" compile "$GITHUB_WORKSPACE/Examples/Distribution/GFX/Drawing.sx" -o "$RUNNER_TEMP/gfx-drawing"

      - name: Build and validate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:HOME = $env:USERPROFILE
          $env:SDL_AUDIODRIVER = "dummy"
          $env:SDL_VIDEODRIVER = "dummy"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          zig build -Doptimize=ReleaseSafe -Dcpu=baseline --prefix "$env:RUNNER_TEMP/silex-prefix" --build-file Toolchain/build.zig
          $silex = Join-Path $env:RUNNER_TEMP "silex-prefix/bin/silex.exe"
          & $silex setup
          & $silex install STD
          & $silex install GFX
          & $silex test (Join-Path $env:GITHUB_WORKSPACE "Tests/Types/Str/Operators.sx")
          & $silex test (Join-Path $env:GITHUB_WORKSPACE "Tests/Types/Str/Returns.sx")
          $packages = Join-Path $env:RUNNER_TEMP "packages"
          New-Item -ItemType Directory -Force $packages | Out-Null
          Copy-Item -Recurse (Join-Path $env:USERPROFILE ".silex/packages/GFX@0.23.1") (Join-Path $packages "GFX")
          Set-Location $packages
          $gfx = Join-Path $packages "GFX"
          $colorTest = Join-Path $gfx "Tests/Color.sx"
          $colorLines = Get-Content $colorTest
          $paletteStart = [Array]::IndexOf($colorLines, 'test "provide the historical named palette" {')
          $diagnostic = @("use GFX.Color", "")
          for ($index = $paletteStart + 1; $index -lt $colorLines.Count - 1; $index++) {
            if ($colorLines[$index].Trim().StartsWith("assert(")) {
              $diagnostic += "test `"palette source line $($index + 1)`" {"
              $diagnostic += $colorLines[$index]
              $diagnostic += "}"
            }
          }
          Set-Content $colorTest $diagnostic
          & $silex test (Join-Path $gfx "Tests/Color.sx")
          & $silex test (Join-Path $gfx "Tests/TransformCamera.sx")
          & $silex test (Join-Path $gfx "Tests/CollectionFieldMutation.sx")
          $nativeLibraries = Join-Path $gfx "Smokes/NativeLibraries.sx"
          $nativeExecutable = Join-Path $env:RUNNER_TEMP "gfx-native-libraries.exe"
          & $silex compile $nativeLibraries -o $nativeExecutable
          & $nativeExecutable
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Runtime.sx") -o "$env:RUNNER_TEMP/gfx-runtime.exe"
          & "$env:RUNNER_TEMP/gfx-runtime.exe"
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Window.sx") -o "$env:RUNNER_TEMP/gfx-window.exe"
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Drawing.sx") -o "$env:RUNNER_TEMP/gfx-drawing.exe"
