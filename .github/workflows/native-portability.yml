name: Validate native x64 toolchain

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Toolchain/**"
      - "Tests/Native/**"
      - "Examples/Distribution/**"
      - ".github/workflows/native-portability.yml"
  push:
    branches: [main]
    paths:
      - "Toolchain/**"
      - "Tests/Native/**"
      - "Examples/Distribution/**"
      - ".github/workflows/native-portability.yml"

permissions:
  contents: read

jobs:
  x64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            shell: bash
          - runner: windows-2025
            shell: pwsh
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out Silex
        uses: actions/checkout@v6

      - name: Install bootstrap Zig on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Install bootstrap Zig on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") {
            throw "Zig archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0")

      - name: Build and validate on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          zig build -Doptimize=ReleaseFast -Dcpu=baseline --prefix "$RUNNER_TEMP/silex-prefix" --build-file Toolchain/build.zig
          silex="$RUNNER_TEMP/silex-prefix/bin/silex"
          "$silex" setup
          "$silex" install STD
          "$silex" install GFX
          "$silex" test "$GITHUB_WORKSPACE/Tests/Types/Str/Operators.sx"
          "$silex" test "$GITHUB_WORKSPACE/Tests/Types/Str/Returns.sx"
          "$silex" test "$GITHUB_WORKSPACE/Tests/Native/X64Portability.sx"
          find_package() {
            find "$HOME/.silex/packages" -maxdepth 1 -type d -name "$1@*" -print -quit
          }
          gfx=$(find_package GFX)
          gfx_scene2d=$(find_package GFX.Scene2D)
          gfx_audio=$(find_package GFX.Audio)
          gfx_canvas=$(find_package GFX.Canvas)
          test -n "$gfx" && test -n "$gfx_scene2d" && test -n "$gfx_audio" && test -n "$gfx_canvas"
          "$silex" test "$gfx/Tests/Color.sx"
          "$silex" test "$gfx_scene2d/Tests/ViewportCamera.sx"
          "$silex" test "$gfx/Tests/Application/CollectionFieldMutation.sx"
          "$silex" compile "$gfx_audio/Smokes/Audio.sx" -o "$RUNNER_TEMP/gfx-audio"
          timeout 30s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$RUNNER_TEMP/gfx-audio"
          "$silex" compile "$gfx_canvas/Smokes/Text.sx" -o "$RUNNER_TEMP/gfx-text"
          timeout 30s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$RUNNER_TEMP/gfx-text"
          "$silex" compile "$GITHUB_WORKSPACE/Tests/Native/X64Portability.sx" --release -o "$RUNNER_TEMP/x64-portability"
          portability_output=$("$RUNNER_TEMP/x64-portability")
          printf '%s\n' "$portability_output"
          cycle_drops=$(printf '%s\n' "$portability_output" | grep -c '^x64 cycle drop$')
          test "$cycle_drops" -eq 6
          "$silex" compile "$GITHUB_WORKSPACE/Examples/Distribution/GFX/Runtime.sx" -o "$RUNNER_TEMP/gfx-runtime"
          timeout 30s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$RUNNER_TEMP/gfx-runtime"
          "$silex" compile "$GITHUB_WORKSPACE/Examples/Distribution/GFX/Window.sx" -o "$RUNNER_TEMP/gfx-window"
          "$silex" compile "$GITHUB_WORKSPACE/Examples/Distribution/GFX/Canvas.sx" -o "$RUNNER_TEMP/gfx-canvas"
          "$silex" compile "$GITHUB_WORKSPACE/Examples/Distribution/GFX/Extensibility.sx" -o "$RUNNER_TEMP/gfx-extensibility"

      - name: Build and validate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:HOME = $env:USERPROFILE
          $env:SDL_AUDIODRIVER = "dummy"
          $env:SDL_VIDEODRIVER = "dummy"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          zig build -Doptimize=ReleaseFast -Dcpu=baseline --prefix "$env:RUNNER_TEMP/silex-prefix" --build-file Toolchain/build.zig
          $silex = Join-Path $env:RUNNER_TEMP "silex-prefix/bin/silex.exe"
          & $silex setup
          & $silex install STD
          & $silex install GFX
          & $silex test (Join-Path $env:GITHUB_WORKSPACE "Tests/Types/Str/Operators.sx")
          & $silex test (Join-Path $env:GITHUB_WORKSPACE "Tests/Types/Str/Returns.sx")
          & $silex test (Join-Path $env:GITHUB_WORKSPACE "Tests/Native/X64Portability.sx")
          function Find-Package([string] $name) {
            $package = Get-ChildItem (Join-Path $env:USERPROFILE ".silex/packages") -Directory -Filter "$name@*" | Select-Object -First 1
            if (-not $package) {
              throw "$name was not installed"
            }
            return $package.FullName
          }
          $gfx = Find-Package "GFX"
          $gfxScene2D = Find-Package "GFX.Scene2D"
          $gfxAudio = Find-Package "GFX.Audio"
          $gfxCanvas = Find-Package "GFX.Canvas"
          & $silex test (Join-Path $gfx "Tests/Color.sx")
          & $silex test (Join-Path $gfxScene2D "Tests/ViewportCamera.sx")
          & $silex test (Join-Path $gfx "Tests/Application/CollectionFieldMutation.sx")
          $audio = Join-Path $env:RUNNER_TEMP "gfx-audio.exe"
          & $silex compile (Join-Path $gfxAudio "Smokes/Audio.sx") -o $audio
          & $audio
          $text = Join-Path $env:RUNNER_TEMP "gfx-text.exe"
          & $silex compile (Join-Path $gfxCanvas "Smokes/Text.sx") -o $text
          & $text
          $portability = Join-Path $env:RUNNER_TEMP "x64-portability.exe"
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Tests/Native/X64Portability.sx") --release -o $portability
          $portabilityOutput = & $portability
          $portabilityOutput | ForEach-Object { Write-Output $_ }
          $cycleDrops = @($portabilityOutput | Where-Object { $_ -eq "x64 cycle drop" }).Count
          if ($cycleDrops -ne 6) {
            throw "expected 6 X64 cycle finalizers, got $cycleDrops"
          }
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Runtime.sx") -o "$env:RUNNER_TEMP/gfx-runtime.exe"
          & "$env:RUNNER_TEMP/gfx-runtime.exe"
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Window.sx") -o "$env:RUNNER_TEMP/gfx-window.exe"
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Canvas.sx") -o "$env:RUNNER_TEMP/gfx-canvas.exe"
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "Examples/Distribution/GFX/Extensibility.sx") -o "$env:RUNNER_TEMP/gfx-extensibility.exe"
