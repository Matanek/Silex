name: Smoke public Silex installers

run-name: Smoke Silex ${{ inputs.version }} installer (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Silex version, or latest
        required: true
        default: latest
      target:
        description: Published target to execute
        required: true
        type: choice
        default: all
        options:
          - all
          - linux-x64
          - windows-x64

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ inputs.version }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  linux-x64:
    if: inputs.target == 'all' || inputs.target == 'linux-x64'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the owned consumer smoke
        uses: actions/checkout@v6

      - name: Install and execute the published compiler
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          export SILEX_INSTALL_DIR="$RUNNER_TEMP/bin"
          export SILEX_VERSION="$REQUESTED_VERSION"
          mkdir -p "$HOME"
          curl -fsSL https://raw.githubusercontent.com/Matanek/Silex/main/install.sh | sh
          "$SILEX_INSTALL_DIR/silex" --version
          "$SILEX_INSTALL_DIR/silex" setup
          output=$("$SILEX_INSTALL_DIR/silex" run Tests/Native/DistributionSmoke.sx --release)
          test "$output" = "silex distribution ready"

  windows-x64:
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out the owned consumer smoke
        uses: actions/checkout@v6

      - name: Install and execute the published compiler
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:HOME = $env:USERPROFILE
          $env:SILEX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "bin"
          $env:SILEX_VERSION = $env:REQUESTED_VERSION
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          Invoke-Expression (Invoke-RestMethod https://raw.githubusercontent.com/Matanek/Silex/main/install.ps1)
          $silex = Join-Path $env:SILEX_INSTALL_DIR "silex.exe"
          & $silex --version
          & $silex setup
          $output = @(& $silex run Tests/Native/DistributionSmoke.sx --release)
          if ($LASTEXITCODE -ne 0 -or $output.Count -ne 1 -or $output[0] -ne "silex distribution ready") {
            throw "published installer smoke failed"
          }
