name: Smoke public Silex installers

run-name: Smoke Silex ${{ inputs.version }} installer (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Silex version, or latest
        required: true
        default: latest
      target:
        description: Published target to execute
        required: true
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x64
          - linux-arm64
          - linux-x64
          - windows-arm64
          - windows-x64

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ inputs.version }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    if: inputs.target == 'all' || inputs.target == 'macos-arm64'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: .github/scripts/smoke-public-unix.sh macos-arm64 '${{ inputs.version }}'

  macos-x64:
    if: inputs.target == 'all' || inputs.target == 'macos-x64'
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: .github/scripts/smoke-public-unix.sh macos-x64 '${{ inputs.version }}'

  linux-arm64:
    if: inputs.target == 'all' || inputs.target == 'linux-arm64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: .github/scripts/smoke-public-unix.sh linux-arm64 '${{ inputs.version }}'

  linux-x64:
    if: inputs.target == 'all' || inputs.target == 'linux-x64'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: .github/scripts/smoke-public-unix.sh linux-x64 '${{ inputs.version }}'

  windows-arm64:
    if: inputs.target == 'all' || inputs.target == 'windows-arm64'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: .github/scripts/smoke-public-windows.ps1 -Target windows-arm64 -Version '${{ inputs.version }}'

  windows-x64:
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: .github/scripts/smoke-public-windows.ps1 -Target windows-x64 -Version '${{ inputs.version }}'
