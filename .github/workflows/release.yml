name: Release Silex

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-15

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Verify the release version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version=$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)",/\1/p' Toolchain/build.zig.zon)
          test -n "$manifest_version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$manifest_version" = "${GITHUB_REF_NAME#v}"
          fi

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz -o zig.tar.xz
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"

      - name: Build the standalone compiler
        working-directory: Toolchain
        run: zig build -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/silex-prefix"

      - name: Assemble and smoke-test the artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/silex-macos-arm64/bin"
          cp "$RUNNER_TEMP/silex-prefix/bin/silex" "$RUNNER_TEMP/silex-macos-arm64/bin/silex"
          cp LICENSE NOTICE README.md "$RUNNER_TEMP/silex-macos-arm64/"
          "$RUNNER_TEMP/silex-macos-arm64/bin/silex" --version
          "$RUNNER_TEMP/silex-macos-arm64/bin/silex" targets
          "$RUNNER_TEMP/silex-macos-arm64/bin/silex" install STD
          output=$("$RUNNER_TEMP/silex-macos-arm64/bin/silex" run Examples/Distribution/Hello.sx)
          printf '%s\n' "$output"
          test "$output" = "84"
          tar -C "$RUNNER_TEMP" -czf silex-macos-arm64.tar.gz silex-macos-arm64
          shasum -a 256 silex-macos-arm64.tar.gz > silex-macos-arm64.tar.gz.sha256

      - name: Retain the release files
        uses: actions/upload-artifact@v4
        with:
          name: silex-macos-arm64
          path: |
            silex-macos-arm64.tar.gz
            silex-macos-arm64.tar.gz.sha256
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Verify the release version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version=$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)",/\1/p' Toolchain/build.zig.zon)
          test -n "$manifest_version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$manifest_version" = "${GITHUB_REF_NAME#v}"
          fi

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build the standalone compiler
        working-directory: Toolchain
        run: zig build -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/silex-prefix"

      - name: Assemble and smoke-test the artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/silex-linux-x64/bin"
          cp "$RUNNER_TEMP/silex-prefix/bin/silex" "$RUNNER_TEMP/silex-linux-x64/bin/silex"
          cp LICENSE NOTICE README.md "$RUNNER_TEMP/silex-linux-x64/"
          "$RUNNER_TEMP/silex-linux-x64/bin/silex" --version
          "$RUNNER_TEMP/silex-linux-x64/bin/silex" targets
          "$RUNNER_TEMP/silex-linux-x64/bin/silex" install STD
          output=$("$RUNNER_TEMP/silex-linux-x64/bin/silex" run Examples/Distribution/Hello.sx)
          printf '%s\n' "$output"
          test "$output" = "84"
          tar -C "$RUNNER_TEMP" -czf silex-linux-x64.tar.gz silex-linux-x64
          sha256sum silex-linux-x64.tar.gz > silex-linux-x64.tar.gz.sha256

      - name: Retain the release files
        uses: actions/upload-artifact@v4
        with:
          name: silex-linux-x64
          path: |
            silex-linux-x64.tar.gz
            silex-linux-x64.tar.gz.sha256
          if-no-files-found: error

  windows-x64:
    runs-on: windows-2025

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Verify the release version
        shell: pwsh
        run: |
          $manifest = Get-Content Toolchain/build.zig.zon -Raw
          if ($manifest -notmatch '\.version\s*=\s*"([^"]+)"') {
            throw "Toolchain manifest does not declare a version"
          }
          $manifestVersion = $Matches[1]
          if ("${{ github.event_name }}" -eq "push") {
            $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
            if ($manifestVersion -ne $tagVersion) {
              throw "Tag and toolchain versions differ"
            }
          }

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") {
            throw "Zig archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0")

      - name: Build the standalone compiler
        working-directory: Toolchain
        shell: pwsh
        run: zig build -Doptimize=ReleaseSafe --prefix "$env:RUNNER_TEMP/silex-prefix"

      - name: Assemble and smoke-test the artifact
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "silex-windows-x64"
          $bin = Join-Path $root "bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item "$env:RUNNER_TEMP/silex-prefix/bin/silex.exe" $bin
          Copy-Item LICENSE, NOTICE, README.md $root
          $silex = Join-Path $bin "silex.exe"
          & $silex --version
          & $silex targets
          & $silex install STD
          $output = & $silex run Examples/Distribution/Hello.sx
          if ($LASTEXITCODE -ne 0) {
            throw "Silex package smoke failed with exit code $LASTEXITCODE"
          }
          $output
          if (($output -join "`n").Trim() -ne "84") {
            throw "Silex package smoke produced unexpected output"
          }
          Compress-Archive $root silex-windows-x64.zip
          $hash = (Get-FileHash silex-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  silex-windows-x64.zip" | Set-Content -NoNewline silex-windows-x64.zip.sha256

      - name: Retain the release files
        uses: actions/upload-artifact@v4
        with:
          name: silex-windows-x64
          path: |
            silex-windows-x64.zip
            silex-windows-x64.zip.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [macos-arm64, linux-x64, windows-x64]
    runs-on: ubuntu-24.04

    steps:
      - name: Collect the verified release files
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Silex $GITHUB_REF_NAME" \
            --generate-notes
