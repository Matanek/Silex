name: Publish Silex release candidate

run-name: Publish Silex v${{ inputs.version }} (${{ inputs.target }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
      target:
        description: Release artifacts to build in this run
        required: true
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - linux-x64
          - windows-x64
      reuse_run_id:
        description: Prior release run providing the other verified artifacts
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify the unpublished release candidate
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release version must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          manifest_version=$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)",/\1/p' Toolchain/build.zig.zon)
          test "$manifest_version" = "$RELEASE_VERSION"
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$RELEASE_TARGET" = "all" ]; then
            test -z "$REUSE_RUN_ID"
          elif [[ ! "$REUSE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "a partial release requires a numeric reuse_run_id" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "tag v$RELEASE_VERSION already exists" >&2
            exit 1
          fi

  macos-arm64:
    needs: preflight
    if: inputs.target == 'all' || inputs.target == 'macos-arm64'
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz -o "$archive"
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  $archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"

      - name: Build and assemble macOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          (cd Toolchain && zig build -Doptimize=ReleaseFast --prefix "$RUNNER_TEMP/silex-prefix")
          root="$RUNNER_TEMP/silex-macos-arm64"
          mkdir -p "$root/bin"
          cp "$RUNNER_TEMP/silex-prefix/bin/silex" "$root/bin/silex"
          cp LICENSE NOTICE README.md "$root/"
          "$root/bin/silex" --version
          "$root/bin/silex" targets
          tar -C "$RUNNER_TEMP" -czf silex-macos-arm64.tar.gz silex-macos-arm64
          shasum -a 256 silex-macos-arm64.tar.gz > silex-macos-arm64.tar.gz.sha256

      - name: Retain the verified release files
        uses: actions/upload-artifact@v7
        with:
          name: silex-macos-arm64
          path: |
            silex-macos-arm64.tar.gz
            silex-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  linux-x64:
    needs: preflight
    if: inputs.target == 'all' || inputs.target == 'linux-x64'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$archive"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build, assemble and smoke-test Linux X64
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/silex-prefix" \
            --build-file Toolchain/build.zig
          root="$RUNNER_TEMP/silex-linux-x64"
          mkdir -p "$root/bin"
          cp "$RUNNER_TEMP/silex-prefix/bin/silex" "$root/bin/silex"
          cp LICENSE NOTICE README.md "$root/"
          "$root/bin/silex" --version
          "$root/bin/silex" targets
          "$root/bin/silex" setup
          "$root/bin/silex" compile Tests/Native/DistributionSmoke.sx \
            --release -o "$RUNNER_TEMP/distribution-smoke"
          test "$("$RUNNER_TEMP/distribution-smoke")" = "silex distribution ready"
          tar -C "$RUNNER_TEMP" -czf silex-linux-x64.tar.gz silex-linux-x64
          sha256sum silex-linux-x64.tar.gz > silex-linux-x64.tar.gz.sha256

      - name: Retain the verified release files
        uses: actions/upload-artifact@v7
        with:
          name: silex-linux-x64
          path: |
            silex-linux-x64.tar.gz
            silex-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  windows-x64:
    needs: preflight
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") {
            throw "Zig archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0")

      - name: Build, assemble and smoke-test Windows X64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:HOME = $env:USERPROFILE
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          zig build -Doptimize=ReleaseFast -Dcpu=baseline `
            --prefix "$env:RUNNER_TEMP/silex-prefix" `
            --build-file Toolchain/build.zig
          $root = Join-Path $env:RUNNER_TEMP "silex-windows-x64"
          $bin = Join-Path $root "bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item "$env:RUNNER_TEMP/silex-prefix/bin/silex.exe" $bin
          Copy-Item LICENSE, NOTICE, README.md $root
          $silex = Join-Path $bin "silex.exe"
          & $silex --version
          & $silex targets
          & $silex setup
          $smoke = Join-Path $env:RUNNER_TEMP "distribution-smoke.exe"
          & $silex compile Tests/Native/DistributionSmoke.sx --release -o $smoke
          $smokeOutput = @(& $smoke)
          if ($LASTEXITCODE -ne 0 -or $smokeOutput.Count -ne 1 -or $smokeOutput[0] -ne "silex distribution ready") {
            throw "standalone distribution smoke failed"
          }
          Compress-Archive $root silex-windows-x64.zip
          $hash = (Get-FileHash silex-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  silex-windows-x64.zip" | Set-Content -NoNewline silex-windows-x64.zip.sha256

      - name: Retain the verified release files
        uses: actions/upload-artifact@v7
        with:
          name: silex-windows-x64
          path: |
            silex-windows-x64.zip
            silex-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [preflight, macos-arm64, linux-x64, windows-x64]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.macos-arm64.result == 'success' || needs.macos-arm64.result == 'skipped') &&
      (needs.linux-x64.result == 'success' || needs.linux-x64.result == 'skipped') &&
      (needs.windows-x64.result == 'success' || needs.windows-x64.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect verified files from the prior run
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_run_id }}
          path: release-reused
          merge-multiple: true

      - name: Collect files verified in this run
        uses: actions/download-artifact@v8
        with:
          path: release-current
          merge-multiple: true

      - name: Assemble and verify the complete release set
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          if [ -d release-reused ]; then
            cp release-reused/* release/
          fi
          cp release-current/* release/
          expected=(
            silex-macos-arm64.tar.gz
            silex-macos-arm64.tar.gz.sha256
            silex-linux-x64.tar.gz
            silex-linux-x64.tar.gz.sha256
            silex-windows-x64.zip
            silex-windows-x64.zip.sha256
          )
          for file in "${expected[@]}"; do
            test -f "release/$file"
          done
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" = "${#expected[@]}"
          (cd release && sha256sum -c *.sha256)

      - name: Create the annotated tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists on origin" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Silex $tag"
          git push origin "$tag"
          gh release create "$tag" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Silex $tag" \
            --generate-notes

      - name: Refresh the Silex website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN is not configured; run the Silex Website deployment manually"
            exit 0
          fi
          if ! gh api --method POST repos/Matanek/Silex-Website/dispatches \
            -f event_type=silex-released \
            -f "client_payload[version]=$RELEASE_VERSION"; then
            echo "::warning::The Silex release is published, but the website dispatch was rejected; run the website deployment manually"
          fi
